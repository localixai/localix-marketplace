name: CI

# Every push and pull request: each mini app passes `mini-app check` (manifest, style, builds,
# types, tests) against the Localix kit package.json pins, and the plugins pass their own tests and
# Claude Code's validation. A tag `v*` then releases the mini app marketplace.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # A plugin that changed must raise its version, or no install ever receives the change.
      - name: Plugin versions
        if: github.event_name != 'push' || !startsWith(github.event.before, '0000000')
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bun scripts/plugin-versions.ts "$BASE" "$GITHUB_SHA"
      - run: bun install --frozen-lockfile
      # `claude plugin validate` checks the plugins (each --strict) and the marketplace.
      - name: Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Plugins and mini apps
        run: bun run check

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build and sign the mini app marketplace
        env:
          MINI_APP_SIGNING_KEY: ${{ secrets.MINI_APP_SIGNING_KEY }}
        run: bun run pack
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/marketplace/* \
            --title "$GITHUB_REF_NAME" --notes "Localix mini app marketplace $GITHUB_REF_NAME."
